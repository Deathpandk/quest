title = "Quest"

[tool.black]
exclude = '''
(
  \.git
  |\.idea
  |env
  |htmlcov
)
'''
line-length = 100
verbose = false

[tool.isort]
skip_glob = [
    "env/*",
    "htmlcov",
]
profile = "black"

[tool.autoflake]
remove-all-unused-imports = true
recursive = true
exclude = "env,settings,htmlcov"
quiet = true
ignore-init-module-imports = true
in-place = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/factories/*",
    "*/factories.py",
    "*/admin.py",
    "*/apps.py",
    "app/*",
    "manage.py",
]
